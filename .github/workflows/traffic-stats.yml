name: Track repository traffic

# GitHub Insights > Traffic은 최근 14일치만 보여주고 그 이전 데이터는 사라진다.
# 매일 조회수/클론수를 가져와 .github/traffic-data/*.json에 날짜별로 누적 저장해서
# 14일이 지나도 히스토리가 남도록 한다.
on:
  schedule:
    # 매일 UTC 00:30(KST 09:30)에 실행한다. UTC 21:00으로 돌리면 그 시점엔 아직 당일 UTC
    # 날짜가 끝나지 않아 GitHub Traffic API에 전날 데이터가 아예 안 잡히는 문제가 있었다.
    # (참고: API 자체에 1~2일 처리 지연이 있어 이걸로도 항상 전날 데이터가 바로 잡히진
    # 않지만, upsert 방식이라 지연된 날짜는 이후 실행에서 자동으로 채워진다.)
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  traffic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and merge traffic data
        uses: actions/github-script@v7
        with:
          # Traffic API는 administration:read 권한이 필요한데, 기본 GITHUB_TOKEN에는
          # 부여할 수 없는 권한이라(workflow permissions에 administration 항목 자체가 없음)
          # Administration: Read-only 권한을 가진 개인 액세스 토큰을 시크릿으로 등록해서 대신 쓴다.
          github-token: ${{ secrets.TRAFFIC_PAT }}
          script: |
            const fs = require("fs");
            const path = require("path");

            const dir = ".github/traffic-data";
            fs.mkdirSync(dir, { recursive: true });

            // 같은 날짜가 다시 들어오면 최신 값으로 덮어써서(upsert) 14일 창이 겹치는 동안
            // 값이 계속 갱신되다가, 창 밖으로 밀려난 뒤로는 마지막 값이 그대로 보존되게 한다.
            async function mergeMetric(fileName, dataKey, fetcher) {
              const filePath = path.join(dir, fileName);
              const existing = fs.existsSync(filePath)
                ? JSON.parse(fs.readFileSync(filePath, "utf8"))
                : {};

              const { data } = await fetcher();
              for (const day of data[dataKey]) {
                const date = day.timestamp.slice(0, 10);
                existing[date] = { count: day.count, uniques: day.uniques };
              }

              const sorted = Object.fromEntries(
                Object.entries(existing).sort(([a], [b]) => a.localeCompare(b)),
              );
              fs.writeFileSync(filePath, JSON.stringify(sorted, null, 2) + "\n");
            }

            await mergeMetric("views.json", "views", () =>
              github.rest.repos.getViews({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per: "day",
              }),
            );
            await mergeMetric("clones.json", "clones", () =>
              github.rest.repos.getClones({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per: "day",
              }),
            );

      - name: Generate traffic stats card
        run: node scripts/generate-traffic-stats.mjs

      - name: Commit updated traffic data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/traffic-data
          if git diff --cached --quiet; then
            echo "변경된 트래픽 데이터가 없습니다."
            exit 0
          fi
          git commit -m "[$(date +%y%m%d)] 트래픽 통계 자동 갱신"
          git push
